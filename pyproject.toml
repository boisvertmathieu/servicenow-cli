[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "servicenow-cli"
version = "0.1.0"
description = "Search your organisation's ServiceNow instance from the terminal, behind corporate SSO."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "click>=8.1",
  "rich>=13",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
keyring = ["keyring>=24"]
dev = ["pytest>=8", "playwright>=1.45"]

[project.scripts]
sn = "sncli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sncli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
